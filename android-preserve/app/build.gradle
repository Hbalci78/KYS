plugins { id 'com.android.application' }

android {
    namespace 'tr.gov.saglik.khsl.kys'
    compileSdk 35

    defaultConfig {
        applicationId 'tr.gov.saglik.khsl.kys'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
