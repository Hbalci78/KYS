name: Build KHSL KYS v1.0.7 data-free

on:
  push:
    branches: [ apk-v107-preserve-full ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source
        run: |
          cat build/v107_parts/part* > /tmp/v107.b64
          base64 -d /tmp/v107.b64 > /tmp/v107.tar.gz
          tar -xzf /tmp/v107.tar.gz
          rm -rf android-v107
          mv android-app android-v107
          mkdir -p android-v107/app/src/main/assets
          curl -fL --retry 3 https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js -o android-v107/app/src/main/assets/jszip.min.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-v107
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK shell
        uses: actions/upload-artifact@v4
        with:
          name: KHSL-KYS-v107-shell
          path: android-v107/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
