function importGDLRows(rows){if(!rows.length)throw Error('Boş dosya');let cfg=identifyColumns(rows);if(cfg.m.code===undefined||cfg.m.name===undefined)throw Error('GDL sütunları eşleştirilemedi. Başlıklarda Doküman No ve Doküman Adı bulunmalıdır. CSV başlıkları: Doküman No;Doküman Adı;Revizyon No;Doküman Türü;Revizyon Tarihi');let added=0,conflict=0,same=0,skipped=0;for(let row of rows.slice(cfg.header+1,30000)){let code=cleanCode(row[cfg.m.code]),name=String(row[cfg.m.name]||'').trim();if(!code||!name||code.length>60||name.length>250||!/[A-Z]/.test(code)){skipped++;continue}let rev=cfg.m.rev!==undefined?String(row[cfg.m.rev]||'').trim():'',category=cfg.m.category!==undefined?String(row[cfg.m.category]||'').trim():'',date=cfg.m.revDate!==undefined?String(row[cfg.m.revDate]||'').trim():'';let d=state.documents.find(x=>x.code===code);if(!d){state.documents.push({code,name,rev:rev||'Doğrulanmadı',category:category||'Diğer',status:'GDL aktarımı / doğrulanmadı',verified:false,revDate:date,variants:[],imported:true});added++}else if(rev&&norm(rev)!==norm(d.rev)){d.conflictRevisions=d.conflictRevisions||[];if(!d.conflictRevisions.includes(rev))d.conflictRevisions.push(rev);d.verified=false;conflict++}else same++}save(`GDL aktarımı: ${added} yeni, ${conflict} revizyon çakışması, ${same} eşleşen, ${skipped} atlanan`);return {added,conflict,same,skipped}}
function gdlImportModal(){openModal(`<div class="notice">Kaynak GDL Excel (.xlsx) veya CSV dosyanızı seçin. Değişiklikler yalnız uygulamanın yerel indeksine işlenir. Özgün dosyaya yazılmaz. Mükerrer kodlar üzerinde kör güncelleme yapılmaz.</div><form id="gdlImportForm"><div class="dropzone" style="margin-top:14px"><b>GDL dosyasını seçin</b><p class="tiny">P.14-LS.01 gibi GDL için başlıklar otomatik tanınmaya çalışılır.</p><input class="input" name="file" type="file" required accept=".xlsx,.csv,.tsv,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"></div><div class="modal-foot">${btn('Vazgeç','close-modal')}<button type="submit" class="btn primary">Kontrol et ve içe aktar</button></div></form>`,'GDL Excel / CSV Toplu İçe Aktarma');$('#gdlImportForm').addEventListener('submit',async e=>{e.preventDefault();let file=e.target.elements.file.files[0];if(!file)return;try{let rows=/\.xlsx$/i.test(file.name)?await readXLSX(file):parseCSV(await file.text()),cfg=identifyColumns(rows);if(cfg.m.code===undefined||cfg.m.name===undefined)throw Error('GDL başlıkları algılanamadı. Dosyadaki ilk başlık satırını kontrol edin.');let preview=rows.slice(cfg.header+1,cfg.header+6).map(r=>[r[cfg.m.code],r[cfg.m.name]].join(' → ')).join('\n');if(!confirm(`GDL aktarımı: ${rows.length-cfg.header-1} olası satır.\nÖrnekler:\n${preview}\n\nYalnız indeks aktarılacak. Onaylıyor musunuz?`))return;let x=importGDLRows(rows);closeModal();goto('gdl');toast(`GDL: ${x.added} yeni, ${x.conflict} çakışma, ${x.same} eşleşen.`,x.conflict?'error':undefined)}catch(ex){toast('İçe aktarma başarısız: '+ex.message,'error')}})}
function submitDDTF(id){const d=state.ddtf.find(x=>x.id===id);if(!d)return;if(d.status!=='Taslak'){toast('Yalnız taslak kayıt incelemeye gönderilebilir.','error');return}if(!d.reason.trim()||!d.oldText.trim()||!d.newText.trim()){toast('İncelemeye göndermek için Eski, Yeni ve Gerekçe alanları zorunludur.','error');return}if(!confirm(`${d.docCode} incelemeye gönderilsin mi? Bu işlem GDL veya master dosyayı değiştirmez.`))return;d.status='İncelemede';d.submitted=iso();d.updated=iso();save('DDTF incelemeye gönderildi: '+d.docCode);closeModal();goto('ddtf');toast('İnceleme kuyruğuna alındı; master değişmedi.')}
function atlas(){let ds=state.documents.filter(d=>{let text=[d.code,d.name,d.category,d.rev,...(d.variants||[]).map(v=>v.label)].join(' ').toLocaleLowerCase('tr');return (!filters.q||text.includes(filters.q.toLocaleLowerCase('tr')))&&(filters.kind==='Tümü'||d.category===filters.kind)&&(filters.bucket==='Tümü'||(d.variants||[]).some(v=>(v.bucket||'Kaynak adayı')===filters.bucket))});if(!state.documents.some(d=>d.code===selDoc))selDoc=state.documents[0]?.code;const detail=state.documents.find(d=>d.code===selDoc);return `${pageHeader('Doküman Atlası','Master, boş, dolu, PDF, Word ve Excel kopyalarına tek arayüzden erişim. Kayıtlar bu tarayıcıda tutulur.',btn('＋ Dosya ekle','import-file','primary'))}

function people(){let rows=state.people;return `${pageHeader('Personel Sicili','Personel kimliği, görevi ve birimi DDTF dâhil tüm iş akışlarında tek kaynaktan kullanılır.',btn('＋ Personel ekle','add-person','primary')+btn('CSV içe aktar','csv-people'))}<div class="card table-wrap"><table class="data-table"><thead><tr><th>Ad ve soyad</th><th>Görev</th><th>Birim</th><th>Kayıt bağlantıları</th><th></th></tr></thead><tbody>${rows.length?rows.map(p=>`<tr><td><strong>${esc(p.name)}</strong><span class="sub">Sicil / referans: ${esc(p.ref||'Belirtilmedi')}</span></td><td>${esc(p.title||'—')}</td><td>${esc(p.unit||'—')}</td><td>${state.ddtf.filter(d=>d.personId===p.id).length} DDTF · ${state.records.filter(r=>r.personId===p.id).length} diğer</td><td><button class="btn small" data-action="person-edit:${p.id}">Düzenle</button></td></tr>`).join(''):`<tr><td class="empty" colspan="5">Henüz personel verisi yüklenmedi. Gerçek listeyi içe aktarın; örnek personel uydurulmadı.</td></tr>`}</tbody></table></div><div class="info-strip" style="margin-top:14px">Personel bilgileri bu sürümde tarayıcının yerel depolama alanına kaydedilir. Ortak kurumsal veritabanı ve erişim yetkilendirmesi kurulmadan gerçek personel kayıtlarını bu prototipe girmeyin.</div>`}
function ddtf(){let ds=state.ddtf;return `${pageHeader('Doküman Gözden Geçirme','DDTF çalışma akışı: GDL dokümanı, personel, değişiklik ve kayıt ilişkisi.',btn('＋ Yeni DDTF kaydı','new-ddtf','primary'))}<div class="main-grid"><div class="card pad"><div class="card-head"><h3>Gözden geçirme kayıtları</h3><small>${ds.length} kayıt</small></div>${ds.length?ds.map(x=>`<div class="draft-card"><div><b>${esc(x.docCode)} — ${esc(x.docTitle)}</b><small>${esc(x.id)} · ${esc(x.personName||'Personel belirtilmedi')} · ${new Date(x.updated).toLocaleString('tr-TR')}</small></div><div class="btnrow"><span class="tag ${x.status==='Taslak'?'gold':'blue'}">${esc(x.status)}</span><button class="btn small" data-action="ddtf-view:${x.id}">Aç</button></div></div>`).join(''):`<div class="empty">Gözden geçirme kaydı bulunmuyor. Bir doküman seçerek başlayın.</div>`}</div><div class="card pad"><div class="card-head"><h3>İşlem zinciri</h3></div><div class="feed">${[['1','GDL’den seç','Belge kimliği ve mevcut revizyonu alın'],['2','Personelle bağla','Görevli personeli kayıtla ilişkilendirin'],['3','Revizyonu öner','Eski / Yeni / Gerekçe; mevcut içeriği koruyun'],['4','Taslak kaydı','Kararı onaya hazırlayın; GDL aynı kalır'],['5','Kontrollü uygulama','Onay ve gerçek dosya doğrulaması sonrası master güncelleme']].map(x=>`<div class="feed-item"><span class="feed-pin">${x[0]}</span><div><b>${x[1]}</b><p>${x[2]}</p></div></div>`).join('')}</div><div class="notice">Bu DDTF çıktısı resmî KHSL master formunun birebir kopyası değildir. Kaydetme, resmî dokümanı onaylamaz veya GDL revizyonunu değiştirmez.</div></div></div>`}

v></div></div></div></div>`}
function draw(){let html=route==='home'?home():route==='atlas'?atlas():route==='gdl'?gdlPage():route==='people'?people():route==='ddtf'?ddtf():route==='relations'?relations():route==='tasks'?tasks():route==='backup'?backup():route==='settings'?settings():route==='smart'?smart():GENERIC[route]?generic(route):home();$('#page').innerHTML=html;let search=$('#atlasSearch');if(search){search.addEventListener('input',e=>{filters.q=e.target.value;drawAtlasTableOnly()});$('#atlasKind').addEventListener('change',e=>{filters.kind=e.target.value;drawAtlasTableOnly()});$('#atlasBucket').addEventListener('change',e=>{filters.bucket=e.target.value;drawAtlasTableOnly()})}let r=$('#relationDoc');if(r)r.addEventListener('change',e=>{selDoc=e.target.value;draw()});let gs=$('#gdlSearch');if(gs)gs.addEventListener('input',e=>{gdlQuery=e.target.value;draw();$('#gdlSearch')?.focus()});let st=$('#gdlStatus');if(st)st.addEventListener('change',e=>{gdlStatus=e.target.value;draw()})}
function drawAtlasTableOnly(){const cur=$('#atlasSearch')?.selectionStart;const focused=document.activeElement?.id;draw();if(focused==='atlasSearch'){let inp=$('#atlasSearch');inp?.focus();try{inp.setSelectionRange(cur,cur)}catch(e){}}}

function ddtfModal(existing=null,docCode=''){let current=existing||{docCode,personId:'',oldText:'',newText:'',reason:'',decision:'Gözden geçirme gerekiyor',followup:'',status:'Taslak'};openModal(`<div class="wizard"><div class="step on"></div><div class="step on"></div><div class="step"></div><div class="step"></div></div><div class="info-strip">Doküman seçilince adı ve mevcut revizyon bilgisi indeks üzerinden getirilir. Bu bir <b>çalışma taslağıdır</b>; resmî master forma otomatik yazılmış değildir.</div><form id="ddtfForm" style="margin-top:15px"><div class="form-grid"><div class="form-group wide"><label>GDL dokümanı *</label>${docSelect('docCode',current.docCode)}</div><div class="form-group"><label>Mevcut kayıtlı revizyon</label><input class="input" id="ddtfRev" readonly value="${esc(state.documents.find(d=>d.code===current.docCode)?.rev||'Belirlenmedi')}"></div><div class="form-group"><label>İlgili personel</label>${personSelect(current.personId)}</div><div class="form-group wide"><label>Gözden geçirme kararı</label><select class="select" name="decision">${['Gözden geçirme gerekiyor','Revizyon öneriliyor','Değişiklik gerekmiyor','Ek kanıt gerekiyor'].map(x=>`<option ${x===current.decision?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-group wide"><label>Eski: Mevcut metin / bulgu</label><textarea class="textarea" name="oldText" placeholder="Kaynak metni ve mevcut durum…">${esc(current.oldText)}</textarea></div><div class="form-group wide"><label>Yeni: Önerilen metin</label><textarea class="textarea" name="newText" placeholder="Silme olmadan, önerilen yeni metin…">${esc(current.newText)}</textarea></div><div class="form-group wide"><label>Gerekçe: Standart / prosedür / bulgu</label><textarea class="textarea" name="reason" placeholder="İlgili madde, risk ve doğrulama gerekçesi…">${esc(current.reason)}</textarea></div><div class="form-group wide"><label>Takip faaliyeti / izleme</label><input class="input" name="followup" value="${esc(current.followup)}" placeholder="Peki sonra ne olur? — sorumlu faaliyet ve kanıt"></div></div><div class="modal-foot"><button type="button" class="btn" data-action="close-modal">İptal</button><button type="submit" class="btn primary">Taslağı kaydet</button></div></form>`,existing?'DDTF Taslağını Düzenle':'GDL Entegre DDTF Oluştur');$('#docCode').addEventListener('change',e=>{$('#ddtfRev').value=state.documents.find(d=>d.code===e.target.value)?.rev||'Belirlenmedi'});$('#ddtfForm').addEventListener('submit',e=>{e.preventDefault();let fd=new FormData(e.target),code=fd.get('docCode'),doc=state.documents.find(d=>d.code===code),p=state.people.find(x=>x.id===fd.get('personId'));if(!doc){toast('GDL dokümanı seçiniz','error');return}let obj={id:existing?.id||uid(),docCode:code,docTitle:doc.name,sourceRev:doc.rev,personId:p?.id||'',personName:p?.name||'',oldText:String(fd.get('oldText')||''),newText:String(fd.get('newText')||''),reason:String(fd.get('reason')||''),decision:String(fd.get('decision')||''),followup:String(fd.get('followup')||''),status:existing?.status||'Taslak',updated:iso(),created:existing?.created||iso()};if(existing){let i=state.ddtf.findIndex(d=>d.id===existing.id);state.ddtf[i]=obj}else state.ddtf.unshift(obj);save('DDTF taslağı kaydedildi: '+code);closeModal();goto('ddtf');toast('Taslak kaydedildi. GDL ve master değiştirilmedi.');ddtfView(obj.id)})}
function ddtfView(id){let d=state.ddtf.find(x=>x.id===id);if(!d)return;selectedDDTF=id;openModal(`<div class="notice good">Yerel kayıt var; resmî onay, imza ve master doküman güncellemesi yapılmadı.</div><div class="draft-preview" id="ddtfPrint"><div class="official-band"><b>KHSL — DOKÜMAN GÖZDEN GEÇİRME ÇALIŞMA KAYDI</b><div style="font-size:10px;color:#b51a31">RESMÎ MASTER FORM DEĞİLDİR — TASLAK</div></div><div class="preview-row"><b>Doküman</b><span>${esc(d.docCode)} — ${esc(d.docTitle)}</span></div><div class="preview-row"><b>Kaynak revizyon</b><span>${esc(d.sourceRev)}</span></div><div class="preview-row"><b>İlgili personel</b><span>${esc(d.personName||'Belirtilmedi')}</span></div><div class="preview-row"><b>Karar</b><span>${esc(d.decision)}</span></div><div class="preview-row"><b>Eski</b><span>${esc(d.oldText).replace(/\n/g,'<br>')||'—'}</span></div><div class="preview-row"><b>Yeni</b><span class="revision">${esc(d.newText).replace(/\n/g,'<br>')||'—'}</span></div><div class="preview-row"><b>Gerekçe</b><span>${esc(d.reason).replace(/\n/g,'<br>')||'—'}</span></div><div class="preview-row"><b>Takip</b><span>${esc(d.followup||'—')}</span></div><div style="margin-top:15px;color:#6b7787;font-size:10px">Kayıt: ${esc(d.id)} · ${new Date(d.updated).toLocaleString('tr-TR')} · Durum: ${esc(d.status)}</div></div><div class="modal-foot">${btn('Düzenle','ddtf-edit:'+d.id)}${d.status==='Taslak'?btn('İncelemeye gönder','ddtf-review:'+d.id,'dark'):''}${btn('Çalışma kopyası yazdır','print-ddtf','primary')}${btn('Kapat','close-modal')}</div>`,'DDTF Kayıt Önizlemesi')}
function personModal(existing){openModal(`<form id="personForm"><div class="form-grid"><div class="form-group wide"><label>Ad soyad *</label><input class="input" required name="name" value="${esc(existing?.name||'')}"></div><div class="form-group"><label>Görev / unvan</label><input class="input" name="title" value="${esc(existing?.title||'')}"></div><div class="form-group"><label>Birim</label><input class="input" name="unit" value="${esc(existing?.unit||'')}"></div><div class="form-group wide"><label>Sicil / referans</label><input class="input" name="ref" value="${esc(existing?.ref||'')}"></div></div><div class="modal-foot">${btn('İptal','close-modal')}<button type="submit" class="btn primary">Kaydet</button></div></form>`,'Personel kaydı');$('#personForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target);let p={id:existing?.id||uid(),name:String(f.get('name')).trim(),title:String(f.get('title')).trim(),unit:String(f.get('unit')).trim(),ref:String(f.get('ref')).trim()};if(existing){state.people[state.people.findIndex(x=>x.id===existing.id)]=p;state.ddtf.filter(d=>d.personId===p.id).forEach(d=>d.personName=p.name);state.records.filter(d=>d.personId===p.id).forEach(d=>d.personName=p.name);}else state.people.push(p);save('Personel kaydı '+(existing?'güncellendi':'eklendi'));closeModal();goto('people');toast('Personel kaydı kaydedildi')})}
function recordModal(key){let [name]=GENERIC[key];openModal(`<div class="notice">${esc(name)} için bağlantılı ön kayıt oluşturulur. Resmî master form üretimi etkin değildir.</div><form id="recordForm" style="margin-top:15px"><div class="form-grid"><div class="form-group wide"><label>Konu / kayıt başlığı *</label><input class="input" name="subject" required placeholder="İşlem veya izleme konusu"></div><div class="form-group"><label>Personel</label>${personSelect()}</div><div class="form-group"><label>İlişkili doküman</label>${docSelect()}</div><div class="form-group"><label>Tarih</label><input type="date" name="date" class="input" value="${new Date().toISOString().slice(0,10)}"></div><div class="form-group"><label>Durum</label><select name="status" class="select"><option>Taslak</option><option>İzlemede</option><option>İncelemeye hazır</option></select></div><div class="form-group wide"><label>Açıklama ve faaliyet</label><textarea class="textarea" name="notes"></textarea></div></div><div class="modal-foot">${btn('İptal','close-modal')}<button type="submit" class="btn primary">Kaydet</button></div></form>`,'Yeni '+name+' kaydı');$('#recordForm').addEventListener('submit',e=>{e.preventDefault();let f=new FormData(e.target),p=state.people.find(x=>x.id===f.get('personId'));state.records.unshift({id:uid(),module:key,subject:String(f.get('subject')),personId:p?.id||'',personName:p?.name||'',docCode:String(f.get('docCode')||''),date:String(f.get('date')||''),notes:String(f.get('notes')||''),status:String(f.get('status')||'Taslak'),updated:iso()});save(name+' kaydı oluşturuldu');closeModal();goto(key);toast('Kayıt yerel alana kaydedildi.')})}
function importModal(){openModal(`<form id="importForm"><div class="dropzone"><b>Özgün dosyaları buraya ekleyin</b><p style="margin:6px 0;font-size:11px">DOCX, XLSX, PDF, CSV, TXT ve diğer formatlar aynen saklanır. İçerikleri otomatik değiştirilmez.</p><input type="file" name="files" multiple required></div><div class="form-grid" style="margin-top:16px"><div class="form-group"><label>Doküman kodu *</label><input class="input" name="code" placeholder="Örn. P.02-LS.02" required></div><div class="form-group"><label>Dosya sınıfı</label><select class="select" name="bucket"><option>Kaynak adayı</option><option>Master</option><option>Boş</option><option>Dolu</option><option>Arşiv</option></select></div><div class="form-group wide"><label>Doküman adı</label><input class="input" name="name" placeholder="İndekste kayıt yoksa yeni ad"></div><div class="form-group"><label>Doküman türü</label><select class="select" name="category">${['Liste','Prosedür','Talimat','Form','Plan','Rapor','Kayıt','Diğer'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-group"><label>Revizyon etiketi</label><input class="input" name="rev" placeholder="Örn. Rev.03 / doğrulanacak"></div></div><div class="modal-foot">${btn('İptal','close-modal')}<button type="submit" class="btn primary">Özgün dosyaları kaydet</button></div></form>`,'Doküman / master / boş / dolu dosya ekle');$('#importForm').addEventListener('submit',async e=>{e.preventDefault();let f=new FormData(e.target),files=[...e.target.elements.files.files],code=String(f.get('code')).trim().toUpperCase();if(!files.length||!code)return;if(!dbReady){toast('Dosya deposu açılamadı. Bu tarayıcıda dosya kaydı yapılamıyor.','error');return}try{let d=state.documents.find(x=>x.code===code);if(!d){d={code,name:String(f.get('name')).trim()||code,category:String(f.get('category')),rev:String(f.get('rev')).trim()||'Doğrulanmadı',status:'Master doğrulanmadı',variants:[]};state.documents.unshift(d)}for(const file of files){let id=uid();await idbPut({id,name:file.name,blob:file,type:file.type,size:file.size});let ext=file.name.split('.').pop().toLowerCase();d.variants.push({kind:ext,label:file.name,bucket:String(f.get('bucket')),source:'Yerel',fileId:id,size:file.size})}save(code+' için '+files.length+' özgün dosya eklendi');closeModal();selDoc=code;goto('atlas');toast(files.length+' dosya saklandı')}catch(err){console.error(err);toast('Dosya kaydedilemedi: '+err.message,'error')}})}
function csvPeople(){openModal(`<div class="info-strip">UTF-8 CSV şeması: <b>Ad Soyad;Görev;Birim;Sicil</b>. İlk satır başlık olarak kabul edilir. Mevcut kişiler otomatik silinmez.</div><form id="csvForm"><input type="file" name="file" accept=".csv,.txt,text/csv" required class="input" style="margin-top:16px"><div class="modal-foot">${btn('İptal','close-modal')}<button class="btn primary" type="submit">İçe aktar</button></div></form>`,'Personel CSV içe aktar');$('#csvForm').addEventListener('submit',async e=>{e.preventDefault();let file=e.target.elements.file.files[0],s=await file.text(),lines=s.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim()),sep=lines[0]?.includes(';')?';':',';let n=0;for(let line of lines.slice(1)){let [name,title,unit,ref]=line.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));if(name){state.people.push({id:uid(),name,title:title||'',unit:unit||'',ref:ref||''});n++}}save(n+' personel CSV ile içe aktarıldı');closeModal();goto('people');toast(n+' personel kaydı eklendi. Mükerrerleri kontrol ediniz.')})}
function fileExtKind(v){return String(v.kind||'').toLowerCase()}
function drivePreviewUrl(v){let id=v.id;return id?'https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview':v.url}
let activeUrl=null;async function previewDoc(composite){let [code,index]=composite.split('|'),d=state.documents.find(x=>x.code===code),v=d?.variants?.[Number(index)];if(!v)return;state.recents=[code,...state.recents.filter(x=>x!==code)].slice(0,12);save();let kind=fileExtKind(v),body='';if(v.source==='Drive'){let url=drivePreviewUrl(v);body=`<div class="info-strip">Google Drive’daki özgün dosya görüntülenir. Erişim, Google hesabınızın izinlerine bağlıdır. Önizleme engellenirse “Drive’da aç” seçiniz.</div><iframe class="view-frame" src="${esc(url)}" title="Özgün Drive dosyası" loading="lazy" style="margin-top:12px"></iframe><div class="modal-foot"><a target="_blank" rel="noopener noreferrer" class="btn primary" href="${esc(v.url)}">↗ Drive’da aç</a><a target="_blank" rel="noopener noreferrer" class="btn" href="${esc(v.url)}">Kaynak bağlantısı</a></div>`}else{let rec=await idbGet(v.fileId);if(!rec){toast('Yerel dosyanın içeriği bulunamadı','error');return}let url=URL.createObjectURL(rec.blob);activeUrl=url;if(kind==='pdf'||rec.type==='application/pdf')body=`<iframe class="view-frame" src="${url}" title="PDF önizlemesi"></iframe>`;else if(['png','jpg','jpeg','gif','webp'].includes(kind))body=`<img style="max-width:100%;max-height:65vh" src="${url}" alt="Dosya önizlemesi">`;else if(['txt','csv','html','json','md'].includes(kind))body=`<pre class="self-test">${esc((await rec.blob.text()).slice(0,100000))}</pre>`;else body=`<div class="empty"><span class="symbol">▤</span>Tarayıcıda yerel ${esc(kind.toUpperCase())} özgün dosyası güvenilir biçimde gömülü görüntülenemiyor. Dosyayı indirip uygun Office uygulamasında açabilirsiniz. Dosyanın kendisi değiştirilmemiştir.</div>`;body+=`<div class="modal-foot"><button class="btn primary" data-action="download-file:${esc(v.fileId)}">↓ Özgün dosyayı indir</button></div>`}openModal(body,`${d.code} · ${v.label}`)}
function idbOpen(){return new Promise((resolve,reject)=>{try{const request=indexedDB.open('KHSL-NEXUS-FILES',1);request.onupgradeneeded=()=>{if(!request.result.objectStoreNames.contains('files'))request.result.createObjectStore('files',{keyPath:'id'})};request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)}catch(e){reject(e)}})}
function idbPut(row){return new Promise((res,rej)=>{let t=db.transaction('files','readwrite'),req=t.objectStore('files').put(row);req.onsuccess=()=>res(true);req.onerror=()=>rej(req.error)})}
function idbGet(id){return new Promise((res,rej)=>{if(!db)return res(null);let t=db.transaction('files','readonly'),req=t.objectStore('files').get(id);req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function idbAll(){return new Promise((res,rej)=>{if(!db)return res([]);let t=db.transaction('files','readonly'),req=t.objectStore('files').getAll();req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)})}
function blobToBase64(b){return new Promise((res,rej)=>{let r=new FileReader;r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(b)})}
function base64ToBlob(s,type){let chars=atob(s),bytes=new Uint8Array(chars.length);for(let i=0;i<chars.length;i++)bytes[i]=chars.charCodeAt(i);return new Blob([bytes],{type:type||'application/octet-stream'})}
function downloadBlob(b,name){let url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
async function exportBackup(){try{toast('Tam yedek paketi hazırlanıyor…');let files=await idbAll();let packed=[];for(let f of files)packed.push({id:f.id,name:f.name,type:f.type,size:f.size,base64:await blobToBase64(f.blob)});let data={format:'khsl-nexus-backup',schema:2,created:iso(),state,files:packed};let json=JSON.stringify(data);downloadBlob(new Blob([json],{type:'application/json'}),'KHSL_NEXUS_TAM_YEDEK_'+new Date().toISOString().slice(0,10)+'.json');save('Tam veri yedeği indirildi ('+files.length+' dosya)');toast('Tam yedek indirildi: '+files.length+' dosya, '+state.documents.length+' doküman kaydı.')}catch(e){toast('Yedek alınamadı: '+e.message,'error')}}
function backupImport(){openModal(`<div class="notice danger">Geri yükleme bu tarayıcıdaki mevcut kayıtların yerine geçer. Önce mevcut tam yedeği indirin. Kaynak Google Drive dosyaları değiştirilmez.</div><form id="restoreForm"><div class="form-group" style="margin-top:15px"><label>KHSL NEXUS tam yedek (.json)</label><input type="file" name="backup" class="input" accept=".json" required></div><div class="modal-foot">${btn('İptal','close-modal')}<button type="submit" class="btn primary">Kontrol et ve geri yükle</button></div></form>`,'Tam yedeği geri yükle');$('#restoreForm').addEventListener('submit',async e=>{e.preventDefault();try{let file=e.target.elements.backup.files[0],packed=JSON.parse(await file.text());if(packed.format!=='khsl-nexus-backup'||packed.schema!==2||!Array.isArray(packed.files)||!packed.state||!Array.isArray(packed.state.documents))throw Error('Bu dosya geçerli bir KHSL NEXUS tam yedeği değil');if(!confirm('Mevcut yerel kayıtlar değişecek. Geri yüklemeyi onaylıyor musunuz?'))return;for(let f of packed.files){if(f.id&&f.base64)await idbPut({id:f.id,name:f.name,blob:base64ToBlob(f.base64,f.type),type:f.type,size:f.size})}state=packed.state;save('Yedek geri yüklendi');closeModal();goto('home');toast('Yedek geri yüklendi.')}catch(err){toast('Geri yükleme engellendi: '+err.message,'error')}})}
function architecture(){openModal(`<div class="feed">${[['1','KYS İşletim Katmanı','Personel, DDTF, cihaz, DF, risk ve diğer ekranlar aynı ilişkili kayıt modelini kullanır.'],['2','Kanonik Doküman Kaydı','GDL belge kodu → onaylı revizyon → benzersiz Drive fileId → Word/Excel/PDF/boş/dolu kopyalar.'],['3','Kurumsal Arka Uç','Google Apps Script / API geçidi: kullanıcı doğrulama, rol bazlı yetki, dosya indeksi ve olay günlüğü.'],['4','Korunan Master Arşivi','Master dosya değişikliği yalnız yetkili onay ve kontrollü revizyon işlemiyle; dosya tarihçesi saklanır.'],['5','Yedek ve Geri Yükleme','Zamanlanmış bulut kopyası, bütünlük kontrolü, ayrı konum, kurtarma testi, zaman damgalı log.']].map(x=>`<div class="feed-item"><span class="feed-pin">${x[0]}</span><div><b>${x[1]}</b><p>${x[2]}</p></div></div>`).join('')}</div><div class="notice">Çalışan sürüm şu an 1. katmanda, yerel veri bağı ve dosya depolama prototipidir. 3–5. katmanlar henüz kurumsal sisteme dağıtılmış değildir.</div>`,'NEXUS hedef sistem mimarisi')}
function globalFind(q){filters.q=q;goto('atlas');$('#atlasSearch')?.focus()}
function act(a){if(!a)return;if(a.startsWith('toggle-fav:')){let code=a.slice(11),i=state.favorites.indexOf(code);if(i>=0)state.favorites.splice(i,1);else state.favorites.unshift(code);save('Sık kullanılanlar güncellendi');draw();return}if(a.startsWith('go-')){goto(a.slice(3));return}if(a==='new-ddtf'){ddtfModal();return}if(a==='gdl-new'){gdlModal();return}if(a==='gdl-import'){gdlImportModal();return}if(a.startsWith('gdl-edit:')){let d=state.documents.find(x=>x.code===a.slice(9));if(d)gdlModal(d);return}if(a.startsWith('gdl-atlas:')){selDoc=a.slice(10);goto('atlas');return}if(a.startsWith('ddtf-review:')){submitDDTF(a.slice(12));return}if(a.startsWith('ddtf-for:')){ddtfModal(null,a.slice(9));return}if(a.startsWith('ddtf-view:')){ddtfView(a.slice(10));return}if(a.startsWith('ddtf-edit:')){let d=state.ddtf.find(x=>x.id===a.slice(10));if(d)ddtfModal(d);return}if(a==='add-person'){personModal();return}if(a.startsWith('person-edit:')){let p=state.people.find(x=>x.id===a.slice(12));if(p)personModal(p);return}if(a.startsWith('record-new:')){recordModal(a.slice(11));return}if(a==='csv-people'){csvPeople();return}if(a==='import-file'){importModal();return}if(a==='reset-filters'){filters={q:'',kind:'Tümü',bucket:'Tümü'};draw();return}if(a.startsWith('relations-for:')){selDoc=a.slice(14);goto('relations');return}if(a==='backup-export'){exportBackup();return}if(a==='backup-import'){backupImport();return}if(a==='architecture-modal'){architecture();return}if(a==='print-ddtf'){const content=$('#ddtfPrint')?.outerHTML;if(!content)return;let w=window.open('','_blank');if(!w){toast('Yazdırma penceresine tarayıcı izin vermedi','error');return}w.document.write('<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>DDTF Çalışma Taslağı</title><style>body{font:12px Arial;margin:24mm;color:#222}.official-band{text-align:center;border-bottom:2px solid #c8102e;padding:0 0 16px}.preview-row{display:grid;grid-template-columns:135px 1fr;gap:12px;border-bottom:1px solid #ddd;padding:9px}.revision{color:#c8102e;font-style:italic}</style></head><body>'+content+'</body></html>');w.document.close();w.focus();setTimeout(()=>w.print(),250);return}if(a.startsWith('download-file:')){idbGet(a.slice(14)).then(r=>r?downloadBlob(r.blob,r.name):toast('Dosya bulunamadı','error'));return}if(a==='close-modal'){closeModal();return}}
